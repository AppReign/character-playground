<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Signing in…</title>
</head>
<body>
<script src="js/oidc-client.min.js"></script>
<script>
    var mgr = new Oidc.UserManager({userStore: new Oidc.WebStorageStateStore()});
    mgr.signinRedirectCallback().then(function () {
        window.location.href = './';
    }).catch(function (err) {
        console.error(err);
        document.body.textContent = 'Sign-in failed. Return to the app and try again.';
    });
</script>
</body>
</html>
